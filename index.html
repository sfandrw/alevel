<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#13110e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f2ed" media="(prefers-color-scheme: light)">
<title>A-Level Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2313110e'/%3E%3Cpath d='M8 10l7 6-7 6' fill='none' stroke='%23ffad3b' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='17' y='20' width='8' height='3' fill='%23ffad3b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=VT323&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: sticky masthead with command-style tabs over one centred column (max 1120px).
   Today splits into the step checklist + a status rail on wide screens.
   A section opens as a full-height workspace sheet; flashcard review is a centred modal.
   Dark-first "amber phosphor" terminal, light mode is a printed readout. */
:root{
  --bg:#13110e; --bg2:#1b1814; --bg3:#26221c; --line:#3c362c; --line2:#2b271f;
  --fg:#efe7d4; --fg2:#bdb29c; --fg3:#91887a;
  --acc:#ffad3b; --acc-ink:#1d1404; --acc-soft:rgba(255,173,59,.13);
  --bio:#5ccfb0; --bio-soft:rgba(92,207,176,.12);
  --chem:#b9a0ff; --chem-soft:rgba(185,160,255,.13);
  --r:#ff6e60; --a:#f0c04c; --g:#8fd65d;
  --scrim:rgba(5,4,3,.62); --shadow:0 18px 50px rgba(0,0,0,.5);
  --disp:"VT323",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f2ed; --bg2:#fbfaf6; --bg3:#e9e6dd; --line:#d2cec2; --line2:#e3e0d6;
    --fg:#1d1b17; --fg2:#4a463d; --fg3:#6c675b;
    --acc:#a65600; --acc-ink:#fff8ec; --acc-soft:rgba(166,86,0,.10);
    --bio:#0a7a5f; --bio-soft:rgba(10,122,95,.09);
    --chem:#6743d2; --chem-soft:rgba(103,67,210,.09);
    --r:#c4382b; --a:#a26f00; --g:#3c8a1e;
    --scrim:rgba(30,25,15,.38); --shadow:0 18px 50px rgba(40,30,10,.2);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f2ed; --bg2:#fbfaf6; --bg3:#e9e6dd; --line:#d2cec2; --line2:#e3e0d6;
  --fg:#1d1b17; --fg2:#4a463d; --fg3:#6c675b;
  --acc:#a65600; --acc-ink:#fff8ec; --acc-soft:rgba(166,86,0,.10);
  --bio:#0a7a5f; --bio-soft:rgba(10,122,95,.09);
  --chem:#6743d2; --chem-soft:rgba(103,67,210,.09);
  --r:#c4382b; --a:#a26f00; --g:#3c8a1e;
  --scrim:rgba(30,25,15,.38); --shadow:0 18px 50px rgba(40,30,10,.2);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--acc)}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.mast-top{display:flex;align-items:center;justify-content:space-between;gap:6px 16px;padding-block:10px 4px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-size:30px;line-height:1;letter-spacing:.03em;display:flex;align-items:center;white-space:nowrap}
.brand .ps{color:var(--acc);margin-right:10px}
.cursor{display:inline-block;width:.5em;height:.82em;background:var(--acc);margin-left:5px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.meta{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:11.5px;color:var(--fg2);text-transform:uppercase;letter-spacing:.08em}
.meta b{color:var(--fg);font-weight:600}
.meta>span{white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--fg3)}
.dot.ok{background:var(--g)} .dot.busy{background:var(--acc)} .dot.local{background:var(--a)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-6px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--fg2);font-size:13px;padding:7px 8px 8px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"],.tab[aria-current="page"]{color:var(--acc);border-bottom-color:var(--acc)}
.tab[aria-selected="true"]::before,.tab[aria-current="page"]::before{content:">";margin-right:2px}
.badge{font-size:10.5px;background:var(--acc);color:var(--acc-ink);border-radius:2px;padding:0 5px;line-height:16px;font-weight:600}

main{padding-block:20px 72px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:16px}
.h1{font-family:var(--disp);font-weight:400;font-size:38px;line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance}
.h1 .ps{color:var(--acc);margin-right:8px}
.sub{color:var(--fg2);font-size:12.5px;margin-top:4px}
.panel{background:var(--bg2);border:1px solid var(--line2);border-radius:3px;padding:14px}
.ph{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--fg3);margin:0 0 10px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph .sp{flex:1}
.stack{display:grid;gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hint{font-family:var(--sans);color:var(--fg2);font-size:13.5px;line-height:1.55;margin:4px 0 10px;max-width:64ch}
.fine{font-family:var(--sans);color:var(--fg3);font-size:12px;margin:10px 0 0;max-width:70ch}
.err{color:var(--r);font-family:var(--sans);font-size:13.5px;margin:6px 0 10px}
.muted{color:var(--fg3)}
.links{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;margin-top:10px}

/* controls */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:3px;padding:6px 11px;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.35;min-height:32px}
.btn:hover{background:var(--bg3);border-color:var(--fg3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);background:var(--acc)}
.btn.sm{font-size:11.5px;padding:3px 8px;min-height:28px}
.btn.ghost{border-color:transparent;color:var(--fg2)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{color:var(--r);border-color:var(--r)}
.btn.on{border-color:var(--acc);color:var(--acc)}
.btn .cnt{font-size:10.5px;background:var(--bg3);border-radius:2px;padding:0 4px;color:var(--fg)}
.inp,.sel,textarea.inp{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:7px 9px;min-height:34px;color:var(--fg);max-width:100%}
.inp:focus,.sel:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 2px var(--acc-soft)}
.inp.num{width:84px}
textarea.inp{width:100%;font-family:var(--sans);font-size:14px;line-height:1.5;resize:vertical;display:block}
.sel{padding-right:6px;cursor:pointer}
.lbl{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin:14px 0 6px}
.ck{appearance:none;-webkit-appearance:none;width:19px;height:19px;border:1.5px solid var(--fg3);border-radius:2px;display:inline-grid;place-content:center;margin:0;cursor:pointer;flex:none;background:transparent}
.ck::after{content:"";width:10px;height:6px;border-left:2px solid var(--acc-ink);border-bottom:2px solid var(--acc-ink);transform:translate(0,-1px) rotate(-45deg);opacity:0}
.ck:checked{background:var(--acc);border-color:var(--acc)}
.ck:checked::after{opacity:1}
.ck:hover{border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px dashed var(--line);background:transparent;color:var(--fg2);border-radius:2px;padding:4px 9px;font-size:12px;cursor:pointer;min-height:30px}
.chip:hover{border-color:var(--fg3);color:var(--fg)}
.chip.on,.chip[aria-pressed="true"]{border-style:solid;border-color:var(--acc);background:var(--acc-soft);color:var(--fg)}
.chip.on::before,.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--acc)}
.pill{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--fg2);border-radius:2px;padding:0 6px;line-height:18px;white-space:nowrap}
.pill.ok{border-color:var(--g);color:var(--g)}
.pill.acc{border-color:var(--acc);color:var(--acc)}
.pill.warn{border-color:var(--a);color:var(--a)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.1em;padding:0 6px;line-height:18px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.tag.bio{color:var(--bio);background:var(--bio-soft)}
.tag.chem{color:var(--chem);background:var(--chem-soft)}
.s-bio{color:var(--bio)} .s-chem{color:var(--chem)}
.bar{height:8px;background:var(--bg3);border-radius:1px;overflow:hidden}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--acc) 0 7px,transparent 7px 9px)}
.bar.bio>i{background:repeating-linear-gradient(90deg,var(--bio) 0 7px,transparent 7px 9px)}
.bar.chem>i{background:repeating-linear-gradient(90deg,var(--chem) 0 7px,transparent 7px 9px)}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--acc);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.busy{color:var(--fg2);font-size:13px;margin:4px 0 10px}

/* banners */
.banner{border:1px solid var(--acc);background:var(--acc-soft);border-radius:3px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;font-family:var(--sans);font-size:13.5px;flex:1 1 280px;min-width:0}
.banner.warn{border-color:var(--a);background:color-mix(in srgb,var(--a) 10%,transparent)}

/* today */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:920px){.grid2{grid-template-columns:minmax(0,1fr)}}
.col-main{display:grid;gap:14px;min-width:0}
.col-side{display:grid;gap:14px;min-width:0}
@media (min-width:921px){.col-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}}
.dayprog{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--fg2)}
.dayprog .bar{flex:1;height:10px}
.sec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px dashed var(--line2)}
.sec:first-of-type{border-top:0;padding-top:0}
.sec .tag{margin-top:2px;align-self:start}
.sec-code{font-size:11.5px;color:var(--fg3);letter-spacing:.04em}
.sec-title{appearance:none;background:none;border:0;padding:0;text-align:left;font-family:var(--sans);font-size:16.5px;font-weight:600;color:var(--fg);cursor:pointer;line-height:1.3;text-wrap:balance}
.sec-title:hover{color:var(--acc)}
.sec-sub{font-size:12px;color:var(--fg3)}
.sec-done{font-size:12px;color:var(--g);margin-top:2px}
.sec-acts{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.sec-acts .sel{max-width:min(100%,300px);font-size:12px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.step{background:var(--bg2);border:1px solid var(--line2);border-radius:3px;padding:14px 14px 8px}
.step-h{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px}
.step-n{font-family:var(--disp);font-size:28px;font-weight:400;color:var(--acc);line-height:.7;min-width:16px}
.step.done .step-n{color:var(--g)}
.step-h .pill{margin-left:auto}
.item{display:flex;align-items:center;gap:8px 10px;padding:9px 0;border-top:1px dashed var(--line2);flex-wrap:wrap}
.item>label{flex:1 1 230px;min-width:0;cursor:pointer;font-size:13px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap}
.item .note{flex-basis:100%;padding-left:29px;font-size:12px;color:var(--fg3)}
.life-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;align-items:start;padding:8px 0;border-top:1px dashed var(--line2)}
.life-row:first-of-type{border-top:0}
.life-k{font-size:11.5px;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em;padding-top:6px}
@media (max-width:480px){.life-row{grid-template-columns:minmax(0,1fr)}.life-k{padding-top:0}}
.big{font-family:var(--disp);font-size:56px;line-height:.85;color:var(--acc)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.stat .k{font-size:10.5px;color:var(--fg3);text-transform:uppercase;letter-spacing:.1em}
.stat .v{font-family:var(--disp);font-size:30px;line-height:1}
.stat .v small{font-family:var(--mono);font-size:12px;color:var(--fg3)}
.subjbar{display:grid;gap:4px;margin-top:10px}
.subjbar .row{justify-content:space-between;font-size:12px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.cell{aspect-ratio:1;border-radius:1px;background:var(--bg3);display:block;max-width:100%}
.cell[data-l="1"]{background:color-mix(in srgb,var(--acc) 32%,var(--bg3))}
.cell[data-l="2"]{background:color-mix(in srgb,var(--acc) 62%,var(--bg3))}
.cell[data-l="3"]{background:var(--acc)}
.cell.fut{background:transparent;outline:1px dashed var(--line2);outline-offset:-1px}
.cell.now{outline:1px solid var(--fg);outline-offset:1px}
.heat-legend{display:flex;justify-content:space-between;font-size:10.5px;color:var(--fg3);margin-top:6px}

/* subject view */
.sumgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:720px){.sumgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ragbar{display:flex;height:8px;border-radius:1px;overflow:hidden;background:var(--bg3)}
.ragbar i{display:block;height:100%}
.ragbar .r{background:var(--r)} .ragbar .a{background:var(--a)} .ragbar .g{background:var(--g)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.filters .inp{flex:1 1 220px;min-width:0}
.grp{border:1px solid var(--line2);background:var(--bg2);border-radius:3px;margin-bottom:8px}
.grp>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"+";color:var(--acc);font-weight:600;width:10px;grid-row:1/3}
.grp[open]>summary::before{content:"−"}
.grp>summary:hover .gt{color:var(--acc)}
.gt{font-family:var(--sans);font-weight:600;font-size:14.5px;min-width:0;text-wrap:balance}
.gt .code{font-family:var(--mono);color:var(--fg3);font-weight:500;margin-right:8px;font-size:12.5px}
.gmeta{font-size:11.5px;color:var(--fg3);display:flex;gap:10px;align-items:center;grid-column:2}
.gmeta .bar{width:90px;height:6px}
.gcount{font-size:12px;color:var(--fg2);grid-row:1/3;grid-column:3}
.branch{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin:18px 0 8px}
.urows{border-top:1px solid var(--line2)}
.urow{appearance:none;width:100%;background:none;border:0;border-top:1px dashed var(--line2);display:grid;grid-template-columns:30px 70px minmax(0,1fr);gap:2px 10px;padding:10px 14px;text-align:left;cursor:pointer;color:var(--fg);align-items:baseline}
.urow:first-child{border-top:0}
.urow:hover{background:var(--bg3)}
.urow.cur{box-shadow:inset 2px 0 0 var(--acc)}
.ust{color:var(--fg3);font-size:12px}
.urow.done .ust{color:var(--g)}
.urow.prog .ust{color:var(--acc)}
.ucode{font-size:12px;color:var(--fg3)}
.ut{font-family:var(--sans);font-size:14px;min-width:0}
.urow.done .ut{color:var(--fg2)}
.umeta{grid-column:3;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--fg3);margin-top:3px}
@media (max-width:520px){.urow{grid-template-columns:26px minmax(0,1fr)}.ucode{grid-column:2}.ut{grid-column:2}.umeta{grid-column:2}}
.ragm{display:inline-flex;gap:2px}
.ragm i{width:7px;height:7px;background:var(--bg3);border:1px solid var(--line);display:block}
.ragm i[data-v="1"]{background:var(--r);border-color:var(--r)}
.ragm i[data-v="2"]{background:var(--a);border-color:var(--a)}
.ragm i[data-v="3"]{background:var(--g);border-color:var(--g)}
.gfoot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px dashed var(--line2)}
.rplist{list-style:none;margin:0;padding:0}
.rplist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line2)}
.rplist li:first-child{border-top:0}
.rplist label{flex:1;min-width:0;font-family:var(--sans);font-size:13.5px;cursor:pointer}
.rplist b{font-family:var(--mono);color:var(--acc);margin-right:6px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end}
.backdrop{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:min(780px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet-head{padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.sh-top{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.crumb{font-size:11.5px;color:var(--fg3);flex:1;min-width:0}
.sh-title{font-family:var(--sans);font-size:21px;font-weight:600;line-height:1.25;margin:8px 0 8px;text-wrap:balance}
.sh-title .ucode{font-family:var(--mono);font-size:15px;color:var(--acc);margin-right:6px;font-weight:500}
.sh-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.sh-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-6px}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pts{list-style:none;margin:0;padding:0;counter-reset:pt}
.pt{border-top:1px dashed var(--line2);padding:10px 0}
.pt:first-child{border-top:0}
.pt-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start}
.pt-text{font-family:var(--sans);font-size:14px;line-height:1.5;padding-top:2px}
.pt-text::before{counter-increment:pt;content:counter(pt) ". ";color:var(--fg3);font-family:var(--mono);font-size:12px}
.rag{appearance:none;width:26px;height:26px;border-radius:2px;border:1.5px dashed var(--line);background:transparent;color:var(--fg3);font:600 11px/1 var(--mono);cursor:pointer}
.rag[data-v="1"]{border:1.5px solid var(--r);color:var(--r);background:color-mix(in srgb,var(--r) 14%,transparent)}
.rag[data-v="2"]{border:1.5px solid var(--a);color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent)}
.rag[data-v="3"]{border:1.5px solid var(--g);color:var(--g);background:color-mix(in srgb,var(--g) 14%,transparent)}
@media (max-width:520px){.pt-row{grid-template-columns:28px minmax(0,1fr)}.pt-row>.btn,.pt-row>.chip{grid-column:2;justify-self:start}}
.rpbox{border:1px solid var(--line2);border-radius:3px;padding:10px 12px;margin:14px 0;background:var(--bg2)}
.vlink{font-size:12px;color:var(--fg3);overflow-wrap:anywhere;margin-top:6px}
details.ms{margin-top:6px;font-size:12.5px}
details.ms summary{cursor:pointer;color:var(--fg2)}
details.ms ul{margin:6px 0 0;padding-left:18px;font-family:var(--sans)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:10px;justify-content:space-between;padding:7px 0;border-top:1px dashed var(--line2);font-size:12.5px;flex-wrap:wrap}
.hist li:first-child{border-top:0}


/* flashcard guide + PMT directions */
u{text-decoration-thickness:2px;text-underline-offset:3px}
.pmt-steps{margin:0;padding-left:20px;font-family:var(--sans);font-size:14px;line-height:1.55;display:grid;gap:6px;max-width:66ch}
.tip{font-family:var(--sans);font-size:13.5px;line-height:1.5;margin:12px 0 0;padding:10px 12px;border-left:3px solid var(--acc);background:var(--acc-soft);max-width:66ch}
.covline{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--fg2);margin:4px 0 8px}
.covline .bar{flex:1;max-width:240px}
.pt-row>.chip{white-space:nowrap}
.ex-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin:18px 0 0}
.fcard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
@media (max-width:640px){.fcard{grid-template-columns:minmax(0,1fr)}}
.face{border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:12px 14px;font-family:var(--sans);font-size:14px;line-height:1.55;min-width:0}
.face p{margin:0 0 8px}
.face p:last-child{margin-bottom:0}
.face u{text-decoration-color:var(--acc)}
.face-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.mk{font-family:var(--mono);font-size:12px;color:var(--fg3);white-space:nowrap}
.face .msh{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin:0 0 4px}
.ms-list{margin:0;padding-left:20px;display:grid;gap:4px}
.expl{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}

/* deadlines + plan */
.pill.bad{border-color:var(--r);color:var(--r)}
.late{color:var(--r)}
.due{color:var(--acc)}
.sec-dl{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--fg3);margin-top:6px}
.planrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:12.5px;padding-top:10px}
.nextlist{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:3px;font-size:11.5px;color:var(--fg2)}
.nextlist li{display:flex;gap:10px;justify-content:space-between}
.nextlist li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nextlist li span:last-child{white-space:nowrap}
.month+.month{margin-top:20px}
.month-h{font-family:var(--disp);font-weight:400;font-size:28px;line-height:1;margin:0 0 4px;color:var(--fg)}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px dashed var(--line2)}
.month-h+.trow{border-top:0}
.tt{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--fg);font-family:var(--sans);font-size:14px;min-width:0}
.tt:hover{color:var(--acc)}
.tt .code{font-family:var(--mono);color:var(--fg3);font-size:12px;margin-right:8px}
.tm{display:flex;gap:6px 12px;align-items:center;justify-content:flex-end;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
@media (max-width:560px){.trow{grid-template-columns:auto minmax(0,1fr)}.tm{grid-column:2;justify-content:flex-start}}
.grp{scroll-margin-top:120px}

/* casper */
.cs-top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.timer{font-family:var(--disp);font-size:46px;line-height:.9;color:var(--acc)}
.timer.low{color:var(--r)}
.cs-title{font-family:var(--sans);font-size:19px;font-weight:600;margin:6px 0 10px;text-wrap:balance}
.cs-s{font-family:var(--sans);font-size:15px;line-height:1.6;margin:0 0 12px;max-width:66ch;white-space:pre-wrap}
.cs-q{font-family:var(--sans);font-weight:600;font-size:14.5px;margin:14px 0 6px}
.cs-q b{font-family:var(--mono);color:var(--acc);margin-right:6px}
.wc{font-size:11px;color:var(--fg3);text-align:right;margin-top:4px}
.speak{border:1px solid var(--acc);border-radius:3px;padding:14px;margin:10px 0;background:var(--acc-soft);font-family:var(--sans);font-size:15px}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks label{font-family:var(--sans);font-size:13.5px;cursor:pointer}
.selfscore{display:flex;gap:6px;flex-wrap:wrap}
.fb{white-space:pre-wrap;font-family:var(--sans);font-size:13.5px;line-height:1.55;border-left:3px solid var(--acc);padding:10px 12px;background:var(--bg2);margin-top:10px}
.facts{margin:0;padding-left:18px;font-family:var(--sans);font-size:13px;line-height:1.55;display:grid;gap:4px}
.facts b{font-family:var(--mono);font-weight:600}
.copybox{width:100%;min-height:120px;font-family:var(--mono);font-size:11px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:70;background:var(--fg);color:var(--bg);font-size:12.5px;padding:9px 14px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  .cursor,.spin{animation:none}
  #toast{transition:none}
}

function casperPick(after) {

/* ---------- plan ---------- */
function vPlan() {
  const p = plan(); const t = TODAY(); const s = st();
  const startsIn = diffDays(t, p.start); const daysLeft = Math.max(0, diffDays(t, p.end));
  const subs = SUBJ.filter((x) => s.set.subj[x]);
  let h = head("plan", "Every topic done by " + esc(fmtLong(p.end)) + " · " + (startsIn > 0 ? "starts " + (startsIn === 1 ? "tomorrow, " : "") + esc(fmtLong(p.start)) : "started " + esc(fmtLong(p.start))),
    "<div class=\"row\"><button class=\"btn\" data-act=\"replan\">Re-plan what's left from today</button><a class=\"btn ghost\" href=\"#setup\">Change dates</a></div>");
  h += "<div class=\"panel\"><div class=\"sumgrid\">";
  for (const subj of subs) {
    const sx = p.stats[subj]; const ps = planStatus(subj);
    h += stat(SPEC[subj].name, sx.done + "<small> / " + sx.total + " sections</small>", "<div class=\"bar " + subj + "\" style=\"margin-top:6px\"><i style=\"width:" + pct(sx.done, sx.total) + "%\"></i></div><div class=\"sec-dl\"><span class=\"pill " + ps.cls + "\">" + esc(ps.txt) + "</span><span>" + (sx.expected ? sx.expected + " due by today" : "first deadline " + esc(fmtDay(p.due[UNITS[subj][0].key]))) + "</span></div>");
  }
  const days = Math.max(1, diffDays(t > p.start ? t : p.start, p.end) + 1);
  const pace = subs.map((subj) => SPEC[subj].short + " " + (Math.round(((p.stats[subj].total - p.stats[subj].done) / days) * 70) / 10)).join(" · ");
  h += stat("Days left", daysLeft + "<small> until " + esc(fmtDay(p.end)) + "</small>") + stat("Sections a week", "<small>" + esc(pace || "–") + "</small>") + "</div>" +
    "<p class=\"fine\">Each section gets time in proportion to its size, in spec order, with both subjects every day. Finish a section early and you're ahead. If you fall behind, Re-plan spreads what's left between today and the deadline." + (p.re ? " Last re-planned " + esc(fmtDay(p.re)) + "." : "") + "</p></div>";
  const items = [];
  for (const subj of subs) for (const g of SPEC[subj].groups) items.push({ subj, g, gs: groupStatus(subj, g) });
  items.sort((a, b) => (a.gs.d < b.gs.d ? -1 : a.gs.d > b.gs.d ? 1 : a.subj < b.subj ? -1 : 1));
  h += "<div class=\"panel\" style=\"margin-top:14px\"><div class=\"ph\">Topic deadlines</div>";
  let curM = "";
  for (const it of items) {
    const m = it.gs.d.slice(0, 7);
    if (m !== curM) { if (curM) h += "</div>"; curM = m; const mm = m.split("-").map(Number); h += "<div class=\"month\"><h2 class=\"month-h\">" + MONL[mm[1] - 1] + " " + mm[0] + "</h2>"; }
    const n = it.g.list.filter((u) => isDone(u.key)).length;
    h += "<div class=\"trow\">" + subjTag(it.subj) + "<button class=\"tt\" data-act=\"gotoTopic\" data-subj=\"" + it.subj + "\" data-gid=\"" + esc(it.g.id) + "\"><span class=\"code\">" + esc(it.g.id) + "</span>" + esc(it.g.t) + "</button>" +
      "<span class=\"tm\"><span>" + n + "/" + it.g.list.length + " sections</span><span class=\"" + (it.gs.cls === "bad" ? "late" : "") + "\">by " + esc(fmtDay(it.gs.d)) + "</span><span class=\"pill " + it.gs.cls + "\">" + esc(it.gs.txt) + "</span></span></div>";
  }
  if (curM) h += "</div>";
  if (!items.length) h += "<p class=\"hint\">Switch a subject on in <a href=\"#setup\">setup</a> to see its deadlines.</p>";
  return h + "</div>";
}

/* ---------- flashcards guide ---------- */
function face(k, html) { return "<div class=\"face\"><div class=\"face-k\">" + k + "</div>" + html + "</div>"; }
function vFlash() {

    "<ol class=\"pmt-steps\"><li>Open today's section and take one spec point at a time.</li><li>Turn the point into a question an examiner could ask.</li><li>On the back, write the answer the way a mark scheme would, and underline the key words.</li><li>Make 1–3 cards per point, one idea per card. Then tap <b>Card made</b> next to that point.</li></ol>" +
    "<div class=\"ex-h\">Example · 3.1.1 Monomers and polymers</div>" +
    "<div class=\"fcard\">" + face("Front", "<p>What is a condensation reaction?</p>") + face("Back", "<p>A reaction that <u>joins</u> two molecules with a chemical <u>bond</u> and <u>releases</u> a molecule of <u>water</u>.</p>") + "</div>" +
    "<div class=\"fcard\">" + face("Front", "<p>What is a hydrolysis reaction?</p>") + face("Back", "<p>A reaction that <u>breaks</u> a chemical bond between two molecules <u>using</u> a molecule of <u>water</u>.</p>") + "</div></div>";
  h += "<div class=\"panel\"><div class=\"ph\">2 · Cards from questions you got wrong<span class=\"sp\"></span><span>step 5</span></div>" +
    "<ol class=\"pmt-steps\"><li><b>Front:</b> the question, exactly as the paper asks it, with the marks.</li><li><b>Back:</b> the mark scheme, with its <u>underlined</u> key words.</li><li><b>Underneath:</b> your explanation, in your own words, of what the answer needed and why you lost the mark.</li></ol>" +
    "<div class=\"ex-h\">Example · PMT 1.1 Monomers and Polymers</div>" +
    "<div class=\"fcard\">" + face("Front", "<p>Galacto-oligosaccharides (GOS) are polymers of galactose.</p><p>Explain why GOS are described as polysaccharides. <span class=\"mk\">(2 marks)</span></p>") +
    face("Back", "<p class=\"msh\">Mark scheme · any two</p><ol class=\"ms-list\"><li>Galactose is a monosaccharide / monomer</li><li>(Polysaccharide is a) <u>carbohydrate</u> polymer</li><li>(Several) monosaccharides / galactose joined by <u>condensation</u> reactions <i>or</i> joined by <u>glycosidic</u> bonds</li></ol>" +
      "<div class=\"expl\"><p class=\"msh\">My explanation</p><p>I wrote \"a polysaccharide is a polymer\" and didn't get the mark. The key word is CARBOHYDRATE: a polysaccharide is a carbohydrate polymer. GOS count because they're lots of galactose monomers (monosaccharides) joined by glycosidic bonds, made in condensation reactions.</p></div>") + "</div>" +
    "<p class=\"fine\">The underlined words are the ones you have to write to get the mark. \"A polymer\" scores nothing; \"a <u>carbohydrate</u> polymer\" scores.</p></div>";
  h += "</div><aside class=\"col-side\">";
  h += "<div class=\"panel\"><div class=\"ph\">Making a card in Anki</div><ol class=\"pmt-steps\">" +
    "<li>Open Anki and click <b>Add</b>.</li>" +
    "<li>Type: <b>Basic</b>. Deck: one per subject and topic, e.g. <b>Biology::3.1 Biological molecules</b>.</li>" +
    "<li>Type the question in <b>Front</b> and the answer or mark scheme in <b>Back</b>.</li>" +
    "<li>Select each key word and press <b>Ctrl+U</b> (<b>⌘U</b> on a Mac) to underline it.</li>" +
    "<li>For a mistake card, add <b>My explanation:</b> under the mark scheme and write why.</li>" +

  h += "<div class=\"panel\"><div class=\"ph\">Every day</div><p class=\"hint\" style=\"margin:0\">Open Anki and finish every card it gives you. The cards you made yesterday come back today; that's step 3. Press <b>Again</b> whenever you didn't really know the answer.</p></div>";
  h += "</aside></div>";

}

    "<div class=\"row\" style=\"gap:16px;align-items:flex-start\"><div><label class=\"lbl\" for=\"set-pstart\" style=\"margin-top:0\">Start</label><input id=\"set-pstart\" class=\"inp\" type=\"date\" value=\"" + esc(pl.start) + "\" data-chg=\"setPlanDate\" data-k=\"start\"></div>" +
    "<div><label class=\"lbl\" for=\"set-pend\" style=\"margin-top:0\">Everything done by</label><input id=\"set-pend\" class=\"inp\" type=\"date\" value=\"" + esc(pl.end) + "\" data-chg=\"setPlanDate\" data-k=\"end\"></div></div>" +
    "<div class=\"row\" style=\"margin-top:12px\"><button class=\"btn\" data-act=\"replan\">Re-plan what's left from today</button><a class=\"btn ghost\" href=\"#plan\">See every deadline</a></div></div>";
  h += "<div class=\"panel\"><div class=\"ph\">Videos</div><p class=\"hint\" style=\"margin-top:0\">The Watch button searches YouTube for each section on this channel, until you save a specific video for that section.</p>" +
    SUBJ.map((subj) => "<label class=\"lbl\" for=\"ch-" + subj + "\">" + SPEC[subj].name + "</label><select id=\"ch-" + subj + "\" class=\"sel\" data-chg=\"setChannel\" data-subj=\"" + subj + "\">" + channelOptions(subj) + "</select>" +
      (UI.chOther[subj] ? "<div class=\"row\" style=\"margin-top:8px\"><label class=\"vh\" for=\"cho-" + subj + "\">Channel name</label><input id=\"cho-" + subj + "\" class=\"inp\" placeholder=\"Channel name\" data-draft=\"1\"><button class=\"btn sm\" data-act=\"chOtherSave\" data-subj=\"" + subj + "\">Use this channel</button></div>" : "")).join("") + "</div>";
  h += "<div class=\"panel\"><div class=\"ph\">Countdowns</div><div class=\"row\" style=\"gap:16px;align-items:flex-start\"><div><label class=\"lbl\" for=\"set-exam\" style=\"margin-top:0\">First A-level exam</label><input id=\"set-exam\" class=\"inp\" type=\"date\" value=\"" + esc(set.exam) + "\" data-chg=\"setDate\" data-k=\"exam\"></div>" +
    "<div><label class=\"lbl\" for=\"set-cs\" style=\"margin-top:0\">Casper test date</label><input id=\"set-cs\" class=\"inp\" type=\"date\" value=\"" + esc(set.csDate) + "\" data-chg=\"setDate\" data-k=\"csDate\"></div></div></div>";
  h += "</div><aside class=\"col-side\"><div class=\"panel\"><div class=\"ph\">Where your progress is saved</div><p class=\"hint\" style=\"margin-top:0\">" + esc(storageText()) + "</p><div class=\"row\">" +
    "<button class=\"btn\" data-act=\"exportJson\">" + (S.downloads || !S.inClaude ? "Export backup" : "Copy backup") + "</button><label class=\"btn\" for=\"imp\">Import backup</label><input type=\"file\" id=\"imp\" class=\"vh\" accept=\"application/json,.json\" data-chg=\"importFile\"></div>";
  if (UI.imp) h += "<div class=\"banner\" style=\"margin:12px 0 0\"><p>Import " + plural(UI.imp.ids.length, "item") + " from this backup? Anything with the same name here is replaced.</p><button class=\"btn sm pri\" data-act=\"impDo\">Import</button><button class=\"btn sm ghost\" data-act=\"impCancel\">Cancel</button></div>";
  if (UI.copy && UI.copyCtx === "backup") h += "<label class=\"lbl\" for=\"copybox\">Select all and copy into a note</label><textarea id=\"copybox\" class=\"inp copybox\" readonly>" + esc(UI.copy) + "</textarea>";
  h += "<div class=\"row\" style=\"margin-top:14px\">" + (UI.resetAsk ? "<button class=\"btn danger\" data-act=\"resetDo\">Yes, delete all my progress</button><button class=\"btn ghost\" data-act=\"resetCancel\">Cancel</button>" : "<button class=\"btn ghost\" data-act=\"resetAsk\">Reset everything…</button>") + "</div></div>";
  h += "<div class=\"panel\"><div class=\"ph\">About the spec</div><p class=\"hint\" style=\"margin-top:0\">Sections and numbering follow the AQA A-level specifications for Biology (7402) and Chemistry (7405). The points in each section are short plain-English summaries, so check the official wording for exact detail.</p><div class=\"links\">" + ext(SPEC.bio.specUrl, "AQA Biology spec ↗") + ext(SPEC.chem.specUrl, "AQA Chemistry spec ↗") + "</div></div></aside></div>";
  return h;
}

/* ================= actions ================= */
async function copyText(txt, ctx, okMsg) {
  try { await navigator.clipboard.writeText(txt); toast(okMsg); }
  catch (e) { UI.copy = txt; UI.copyCtx = ctx; renderAll(); setTimeout(() => { const b = $("#copybox"); if (b) { b.focus(); b.select(); } }, 0); toast("Select the text below and copy it."); }
}
const ACT = {
  openSheet: (el) => openSheet(el.dataset.uk, el.dataset.tab),
  closeSheet: () => closeSheet(),
  sheetTab: (el) => { if (!UI.sheet) return; UI.sheet.tab = el.dataset.tab; renderAll(); const b = $("#sheet .sheet-body"); if (b) b.scrollTop = 0; },
  unitDone: (el) => { if (!ready()) return; unitDone(el.dataset.uk); renderAll(); },
  unitUndo: (el) => { if (!ready()) return; unitUndo(el.dataset.uk); renderAll(); },
  studyToday: (el) => { if (!ready()) return; const u = U[el.dataset.uk]; pickUnit(u.subj, u.key); toast(u.id + " is now today's " + SPEC[u.subj].name + " section."); renderAll(); },
  groupMark: (el) => { if (!ready()) return; groupMark(el.dataset.subj, el.dataset.gid, el.dataset.v === "1"); renderAll(); },
  rag: (el) => { if (!ready()) return; const s = st(); const pk = el.dataset.pk; const v = ((s.rag[pk] || 0) + 1) % 4; if (v) s.rag[pk] = v; else delete s.rag[pk]; save("state"); renderAll(); },
  anki: (el) => {
    if (!ready()) return;
    const s = st(); const pk = el.dataset.pk; const uk = pk.slice(0, pk.lastIndexOf("-"));
    if (s.anki[pk]) delete s.anki[pk]; else s.anki[pk] = TODAY();
    markStarted(uk); save("state");
    if (isTodayUnit(uk)) {
      const cov = coverage(uk); const day = dayLog(TODAY());
      if (cov.total && cov.done === cov.total && !(day && day.t[uk + ":f"])) { setTick(uk, "f", true); toast("Every spec point has a card. Step 2 ticked."); }
    }
    renderAll();
  },
  vidSave: (el) => {
    if (!ready()) return;
    const v = ($("#vid-in").value || "").trim();
    if (!isUrl(v)) { toast("Paste the full link, starting with https://"); return; }
    const s = st(); s.prog[el.dataset.uk] = Object.assign({}, s.prog[el.dataset.uk], { vid: v.slice(0, 500) }); save("state");
    UI.drafts["vid-in"] = ""; toast("Video saved for this section."); renderAll();
  },
  vidClear: (el) => { if (!ready()) return; const s = st(); const p = Object.assign({}, s.prog[el.dataset.uk]); delete p.vid; s.prog[el.dataset.uk] = p; save("state"); renderAll(); },
  chOtherSave: (el) => {
    if (!ready()) return;
    const subj = el.dataset.subj; const inp = $("#cho-" + subj); const v = ((inp && inp.value) || "").trim().slice(0, 60);
    if (!v) { toast("Type the channel name first."); return; }
    st().set.ch[subj] = v; save("state"); UI.chOther[subj] = false; delete UI.drafts["cho-" + subj]; toast("Searching " + v + " for " + SPEC[subj].name + "."); renderAll();
  },
  qLog: (el) => {
    if (!ready()) return;
    const sRaw = $("#ql-s").value, sc = Number(sRaw), of = Number($("#ql-o").value), src = $("#ql-src").value;
    if (!(sRaw !== "" && of > 0 && sc >= 0 && sc <= of)) { toast("Enter the marks you got and the total, e.g. 14 out of 20."); return; }
    const s2 = Math.round(sc), o2 = Math.round(of);
    saveAttempt(el.dataset.uk, { src, sc: s2, of: o2 });
    UI.drafts["ql-s"] = ""; UI.drafts["ql-o"] = "";
    toast(o2 > s2 ? "Saved " + s2 + "/" + o2 + ". Now make a card for each question you dropped marks on." : "Saved " + s2 + "/" + o2 + ". Full marks!");
    renderAll();
  },
  filter: (el) => { UI.filter[el.dataset.subj] = el.dataset.f; renderAll(); },
  csMode: (el) => { S.cs.mode = el.dataset.m; renderAll(); },
  csStart: () => { const c = S.cs; c.a = ["", ""]; c.chk = {}; c.self = 0; c.fb = ""; c.fbS = "idle"; c.fbErr = ""; csGo("reflect"); },
  csNext: () => csAdvance(),
  csSelf: (el) => { S.cs.self = +el.dataset.v; renderAll(); },
  csFeedback: () => csFeedback(),
  csFbStop: () => { if (S.cs && S.cs.fbCtl) S.cs.fbCtl.abort(); },
  csSave: () => { csSave(); renderAll(); },
  csDiscard: () => { S.cs = newCs(S.cs.sid, S.cs.mode); renderAll(); },
  csAnother: () => { const nx = casperPick(S.cs.sid); S.cs = newCs(nx.id, S.cs.mode); renderAll(); },
  exportJson: async () => {
    const data = JSON.stringify({ app: "a-level-terminal", v: 2, at: new Date().toISOString(), docs: S.docs });
    if (S.downloads) {
      try { await S.downloads.save({ filename: "a-level-terminal-backup-" + TODAY() + ".json", data }); toast("Backup saved."); }
      catch (e) { if (!(e && e.code === "declined")) copyText(data, "backup", "Backup copied. Paste it into a note to keep it safe."); }
    } else if (!S.inClaude && blobDownload("a-level-terminal-backup-" + TODAY() + ".json", data, "application/json")) toast("Backup downloaded.");
    else copyText(data, "backup", "Backup copied. Paste it into a note to keep it safe.");
  },
  unlock: () => {
    const v = (($("#pass-in") || {}).value || "").trim();
    if (!v) { toast("Type the passcode first."); return; }
    SRV.key = v; lsSet("alt.key", v); UI.drafts["pass-in"] = ""; S.lockErr = ""; S.mode = "connecting"; renderAll();
    srvLoad().then(() => { if (S.mode === "db" && S.dirty.size) scheduleFlush(100); });
  },
  impDo: () => {
    if (!ready() || !UI.imp) return;
    for (const id of UI.imp.ids) {
      const d = clone(UI.imp.docs[id]), prev = S.docs[id];
      if (prev && prev._rev !== undefined) d._rev = prev._rev; else delete d._rev; // the backup replaces what's saved now
      S.docs[id] = d; save(id);
    }
    toast("Imported " + plural(UI.imp.ids.length, "item") + "."); UI.imp = null; S.cs = null; renderAll();
  },
  impCancel: () => { UI.imp = null; renderAll(); },
  resetAsk: () => { UI.resetAsk = true; renderAll(); },
  resetCancel: () => { UI.resetAsk = false; renderAll(); },
  resetDo: () => {
    if (!ready()) return;
    for (const id of Object.keys(S.docs)) { delete S.docs[id]; if (synced()) S.dirty.add(id); }
    S.stateDefault = true; changed();
    if (synced()) scheduleFlush(100); else persistLocal();
    UI.resetAsk = false; S.cs = null; toast("Everything has been reset."); renderAll();
  },
  replan: () => {
    if (!ready()) return;
    const p = plan();
    if (TODAY() > p.end) { toast("The deadline has passed. Set a later one in setup first."); return; }
    replanFromToday(); toast("Re-planned: everything left now runs to " + fmtDay(p.end) + "."); renderAll();
  },
  gotoTopic: (el) => {
    const subj = el.dataset.subj; const gid = subj + "|" + el.dataset.gid;
    UI.openInit[subj] = true; UI.open.add(gid); UI.filter[subj] = "all"; UI.search[subj] = ""; UI.scrollTo = gid;
    location.hash = subj === "bio" ? "biology" : "chemistry";
  },
  useLocal: () => goLocal("unreachable"),
  dismissMerge: () => { S.merged = 0; renderAll(); },
  welcomeOk: () => { if (!ready()) return; st().set.welcomed = true; save("state"); renderAll(); }
};
const CHG = {
  tick: (el) => { if (!ready()) { el.checked = !el.checked; return; } setTick(el.dataset.uk || null, el.dataset.step, el.checked); renderAll(); },
  pickUnit: (el) => { if (!ready()) { renderAll(); return; } pickUnit(el.dataset.subj, el.value); const u = U[el.value]; toast("Today's " + SPEC[u.subj].name + ": " + u.id + " " + u.t); renderAll(); },
  setChannel: (el) => {
    const subj = el.dataset.subj;
    if (el.value === "__other") { UI.chOther[subj] = true; renderAll(); focusLater("cho-" + subj); return; }
    if (!ready()) { renderAll(); return; }
    UI.chOther[subj] = false; st().set.ch[subj] = el.value; save("state"); renderAll();
  },
  rpTick: (el) => { if (!ready()) { el.checked = !el.checked; return; } const s = st(); if (el.checked) s.rp[el.dataset.k] = TODAY(); else delete s.rp[el.dataset.k]; save("state"); renderAll(); },
  setName: (el) => { if (!ready()) return; st().set.name = el.value.trim().slice(0, 40); save("state"); renderMast(); },
  setFlag: (el) => { if (!ready()) { el.checked = !el.checked; return; } const [a, b] = el.dataset.k.split("."); st().set[a][b] = el.checked; save("state"); renderAll(); },
  setCsMode: (el) => { if (!ready()) return; st().set.csMode = el.value; save("state"); if (S.cs && S.cs.phase === "idle") S.cs.mode = casperModeToday(); renderAll(); },
  setDate: (el) => { if (!ready()) return; const v = /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : ""; st().set[el.dataset.k] = v; save("state"); },
  setPlanDate: (el) => {
    if (!ready()) { renderAll(); return; }
    const v = el.value; if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { renderAll(); return; }
    const s = st(); const p = plan();
    if (el.dataset.k === "start") {
      if (v >= p.end) { toast("The start has to be before the deadline."); renderAll(); return; }
      s.plan = { start: v, end: p.end }; save("state"); toast("Plan now runs from " + fmtDay(v) + " to " + fmtDay(p.end) + ".");
    } else {
      if (v <= p.start || v <= TODAY()) { toast("Pick a deadline after today and after the start date."); renderAll(); return; }
      if (TODAY() < p.start && !(s.plan && s.plan.due)) { s.plan = { start: p.start, end: v }; save("state"); }
      else replanFromToday(v);
      toast("Everything now due by " + fmtDay(v) + ".");
    }
    renderAll();
  },
  csPick: (el) => { S.cs = newCs(el.value, S.cs ? S.cs.mode : null); renderAll(); },
  csChk: (el) => { if (S.cs) S.cs.chk[+el.dataset.i] = el.checked; },
  importFile: (el) => {
    const f = el.files && el.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const o = JSON.parse(String(rd.result)); const docs = o && o.docs;
        if (!docs || typeof docs !== "object") throw new Error("bad");
        const ids = Object.keys(docs).filter((id) => /^(state|m-\d{4}-\d{2}|qs-\d{4}-\d{2}-\d{2}|cs-\d{4}-\d{2}-\d{2})$/.test(id) && docs[id] && typeof docs[id] === "object");
        if (!ids.length) throw new Error("empty");
        UI.imp = { docs, ids };
      } catch (e) { UI.imp = null; toast("That file isn't a backup from this page."); }
      el.value = ""; renderAll();
    };
    rd.readAsText(f);
  }
};
const INP = {
  search: (el) => { UI.search[el.dataset.subj] = el.value; const L = $("#ulist"); if (L) L.innerHTML = unitList(el.dataset.subj); },
  csa: (el) => {
    if (!S.cs) return; const i = +el.dataset.i; S.cs.a[i] = el.value;
    const w = $("#cs-wc" + i); if (w) w.textContent = plural(words(el.value), "word");
    const b = $("#cs-fbbtn"); if (b && S.cs.mode === "video") b.disabled = !S.cs.a.some((x) => x.trim());
  }
};

/* ================= events ================= */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === "BUTTON" || el.classList.contains("backdrop")) e.preventDefault();
  fn(el, e);
});
document.addEventListener("change", (e) => { const el = e.target; if (el && el.dataset && el.dataset.chg && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener("input", (e) => {
  const el = e.target; if (!el || !el.dataset) return;
  if (el.dataset.draft && el.id) UI.drafts[el.id] = el.value;
  if (el.dataset.inp && INP[el.dataset.inp]) INP[el.dataset.inp](el, e);
});
document.addEventListener("toggle", (e) => {
  const el = e.target;
  if (!el || !el.matches || !el.matches("details.grp")) return;
  if (performance.now() - S.lastRender < 120) return;
  if (el.open) UI.open.add(el.dataset.gid); else UI.open.delete(el.dataset.gid);
}, true);
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (e.key === "Enter" && t && t.tagName === "INPUT" && t.id) {
    let b = null;
    if (t.id === "vid-in") b = $("[data-act=\"vidSave\"]");
    else if (t.id === "pass-in") b = $("[data-act=\"unlock\"]");
    else if (t.id === "ql-s" || t.id === "ql-o") b = $("[data-act=\"qLog\"]");
    else if (t.id.indexOf("cho-") === 0) b = $("[data-act=\"chOtherSave\"][data-subj=\"" + t.id.slice(4) + "\"]");
    if (b) { e.preventDefault(); b.click(); return; }
  }
  if (UI.sheet && e.key === "Escape") closeSheet();
});
function readHash() { const h = (location.hash || "").replace(/^#/, ""); UI.tab = TABS.some((t) => t[0] === h) ? h : "today"; }
window.addEventListener("hashchange", () => {
  readHash(); UI.sheet = null; renderAll(); window.scrollTo(0, 0);
  if (UI.scrollTo) { const el = document.querySelector("details.grp[data-gid=\"" + UI.scrollTo + "\"]"); UI.scrollTo = null; if (el) el.scrollIntoView({ block: "start" }); }
});

/* ================= boot ================= */
async function boot() {
  readHash();
  const c = window.claude;
  S.inClaude = !!(c && typeof c.use === "function");
  if (!S.inClaude) {
    S.mode = "connecting"; renderAll();
    const hello = await srvPing();
    if (hello) S.srvHost = hello.host === "cloudflare" ? "cloudflare" : "pc";
    if (hello && hello.ok === false) { // served by our server, but its database isn't connected yet
      S.mode = "local"; S.localReason = "setup"; S.docs = readLocal() || {}; S.stateDefault = !S.docs.state; changed(); renderAll(); return;
    }
    if (hello) {
      S.srvMode = true; SRV.key = lsGet("alt.key") || "";
      S.be = {
        set: async (id, d) => srvWrote(id, d, await srvCall("PUT", "api/docs/" + encodeURIComponent(id), d)),
        del: async (id) => srvWrote(id, null, await srvCall("DELETE", "api/docs/" + encodeURIComponent(id)))
      };
      await srvLoad();
      return;
    }
    S.mode = "local"; S.localReason = "noclaude"; S.docs = readLocal() || {}; S.stateDefault = !S.docs.state; changed(); renderAll(); return;
  }
  S.mode = "connecting"; renderAll();
  c.use("sample").then((x) => { S.sample = typeof x === "function" ? x : null; if (UI.tab === "casper") renderAll(); }).catch(() => {});
  c.use("downloads").then((x) => { S.downloads = x || null; if (UI.tab === "setup") renderAll(); }).catch(() => {});
  let db = null, user = null;
  try { const r = await Promise.all([c.use("db"), c.use("user")]); db = r[0]; user = r[1]; } catch (e) {}
  if (!db || !user) { S.mode = "local"; S.localReason = "nodb"; S.docs = readLocal() || {}; S.stateDefault = !S.docs.state; changed(); renderAll(); return; }
  let uid = null;
  try { uid = await user.id(); } catch (e) {}
  if (!uid) { S.mode = "local"; S.localReason = "noid"; S.docs = readLocal() || {}; S.stateDefault = !S.docs.state; changed(); renderAll(); return; }
  try { S.col = db.collection("data/users/" + uid); S.be = { set: (id, d) => S.col.doc(id).set(d), del: (id) => S.col.doc(id).delete() }; }
  catch (e) { S.mode = "local"; S.localReason = "nodb"; S.docs = readLocal() || {}; changed(); renderAll(); return; }
  S.waitT = setTimeout(() => { if (!S.firstSnap && S.mode === "connecting") { S.slow = true; renderAll(); } }, 10000);
  S.unsub = S.col.onSnapshot(onSnap, onSnapErr);
}
boot();
})();

</script>
